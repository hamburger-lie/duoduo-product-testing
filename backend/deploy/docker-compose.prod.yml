# Production Docker Compose for duoduo-product-testing
#
# Prerequisites:
#   1. Copy ../.env.production.example to .env and fill in all values
#   2. Place TLS cert files in ./nginx/ssl/ (fullchain.pem, privkey.pem)
#   3. Run: docker compose -f deploy/docker-compose.prod.yml up -d
#
# Services: postgres, redis, api, worker, beat, nginx, prometheus

x-common-env: &common-env
  APP_ENV: ${APP_ENV:-production}
  APP_SECRET_KEY: ${APP_SECRET_KEY}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-8}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-4}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-2}
  DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
  REDIS_URL: redis://redis:6379/0
  CURRENT_USER_CACHE_TTL_SECONDS: ${CURRENT_USER_CACHE_TTL_SECONDS:-300}
  ACTIVITY_LOG_ENABLED: ${ACTIVITY_LOG_ENABLED:-true}
  ACTIVITY_LOG_SAMPLE_RATE: ${ACTIVITY_LOG_SAMPLE_RATE:-0.1}
  ACTIVITY_LOG_ASYNC: ${ACTIVITY_LOG_ASYNC:-true}
  AI_PROVIDER: ${AI_PROVIDER}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_MODEL_PRO: ${DEEPSEEK_MODEL_PRO:-deepseek-v4-flash}
  DEEPSEEK_MODEL_FLASH: ${DEEPSEEK_MODEL_FLASH:-deepseek-v4-flash}
  ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
  EVALUATION_RUN_MODE: celery
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  WECHAT_APP_ID: ${WECHAT_APP_ID}
  WECHAT_APP_SECRET: ${WECHAT_APP_SECRET}
  CREDIT_COST_PER_PERSONA: ${CREDIT_COST_PER_PERSONA:-10}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  IMAGE_EXTRACT_MODE: ${IMAGE_EXTRACT_MODE:-vision}

services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: always
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *common-env
      STORAGE_ADAPTER: ${STORAGE_ADAPTER:-local}
    volumes:
      - product_images:/app/data/product_images
    expose:
      - "8000"
    command: >
      uv run uvicorn app.main:app
      --host 0.0.0.0 --port 8000
      --workers 2
      --access-log
      --proxy-headers
      --forwarded-allow-ips='*'

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *common-env
      STORAGE_ADAPTER: ${STORAGE_ADAPTER:-local}
    volumes:
      - product_images:/app/data/product_images
    command: >
      uv run celery -A app.tasks.celery_app.celery_app
      worker -Q evaluations -l info -c 4

  beat:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    depends_on:
      redis: { condition: service_healthy }
    environment:
      <<: *common-env
    command: >
      uv run celery -A app.tasks.celery_app.celery_app
      beat -l info

  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  product_images:
