# Nginx reverse proxy for duoduo-product-testing API
# Handles: HTTPS termination, gzip, rate limiting, security headers
#
# Usage:
#   Mount TLS cert/key to /etc/nginx/ssl/
#   Mount this file to /etc/nginx/conf.d/default.conf

upstream api_backend {
    server api:8000;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # --- TLS ---
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Gzip ---
    gzip on;
    gzip_types application/json text/plain application/javascript;
    gzip_min_length 256;

    # --- Request size limit (for image uploads) ---
    client_max_body_size 10m;

    # --- Timeouts ---
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;   # AI calls can be slow
    proxy_send_timeout 30s;

    # --- Auth endpoints (stricter rate limit) ---
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # --- API endpoints ---
    location /api/ {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # --- Health checks (no rate limit, no auth) ---
    location /health/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Metrics (internal only, restrict by IP in production) ---
    location /metrics {
        # Allow Prometheus scraper, deny others
        # allow 10.0.0.0/8;
        # deny all;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Block everything else ---
    location / {
        return 404;
    }
}
