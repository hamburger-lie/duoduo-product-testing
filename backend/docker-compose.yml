services:
  postgres:
    image: postgres:15
    container_name: duoduo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-duoduo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-duoduo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: duoduo-redis
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: duoduo-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc '</dev/tcp/127.0.0.1/6333'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duoduo-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change_me_for_local_development_only}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-duoduo}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      REDIS_URL: redis://redis:6379/0
      CURRENT_USER_CACHE_TTL_SECONDS: ${CURRENT_USER_CACHE_TTL_SECONDS:-300}
      ACTIVITY_LOG_ENABLED: ${ACTIVITY_LOG_ENABLED:-true}
      ACTIVITY_LOG_SAMPLE_RATE: ${ACTIVITY_LOG_SAMPLE_RATE:-1}
      ACTIVITY_LOG_ASYNC: ${ACTIVITY_LOG_ASYNC:-false}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      VISION_PROVIDER: ${VISION_PROVIDER:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL_PRO: ${DEEPSEEK_MODEL_PRO:-deepseek-v4-flash}
      DEEPSEEK_MODEL_FLASH: ${DEEPSEEK_MODEL_FLASH:-deepseek-v4-flash}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ZHIPU_BASE_URL: ${ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      ZHIPU_MODEL_VISION: ${ZHIPU_MODEL_VISION:-glm-4.6v}
      EVALUATION_RUN_MODE: ${EVALUATION_RUN_MODE:-celery}
      STORAGE_ADAPTER: ${STORAGE_ADAPTER:-mock}
      BACKEND_BASE_URL: http://localhost:8000
      IMAGE_EXTRACT_MODE: ${IMAGE_EXTRACT_MODE:-vision}
      SURVEY_AI_TIMEOUT_SECONDS: ${SURVEY_AI_TIMEOUT_SECONDS:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      PLUS_PAYMENT_ENABLED: ${PLUS_PAYMENT_ENABLED:-false}
    ports:
      - "8000:8000"
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    profiles:
      - api

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duoduo-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change_me_for_local_development_only}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-duoduo}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      REDIS_URL: redis://redis:6379/0
      CURRENT_USER_CACHE_TTL_SECONDS: ${CURRENT_USER_CACHE_TTL_SECONDS:-300}
      ACTIVITY_LOG_ENABLED: ${ACTIVITY_LOG_ENABLED:-true}
      ACTIVITY_LOG_SAMPLE_RATE: ${ACTIVITY_LOG_SAMPLE_RATE:-1}
      ACTIVITY_LOG_ASYNC: ${ACTIVITY_LOG_ASYNC:-false}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      VISION_PROVIDER: ${VISION_PROVIDER:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL_PRO: ${DEEPSEEK_MODEL_PRO:-deepseek-v4-flash}
      DEEPSEEK_MODEL_FLASH: ${DEEPSEEK_MODEL_FLASH:-deepseek-v4-flash}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ZHIPU_BASE_URL: ${ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      ZHIPU_MODEL_VISION: ${ZHIPU_MODEL_VISION:-glm-4.6v}
      EVALUATION_RUN_MODE: ${EVALUATION_RUN_MODE:-celery}
      PLUS_PAYMENT_ENABLED: ${PLUS_PAYMENT_ENABLED:-false}
    command: uv run celery -A app.tasks.celery_app.celery_app worker -Q evaluations -l info -c 4
    profiles:
      - worker

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duoduo-beat
    depends_on:
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change_me_for_local_development_only}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-duoduo}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      REDIS_URL: redis://redis:6379/0
      CURRENT_USER_CACHE_TTL_SECONDS: ${CURRENT_USER_CACHE_TTL_SECONDS:-300}
      ACTIVITY_LOG_ENABLED: ${ACTIVITY_LOG_ENABLED:-true}
      ACTIVITY_LOG_SAMPLE_RATE: ${ACTIVITY_LOG_SAMPLE_RATE:-1}
      ACTIVITY_LOG_ASYNC: ${ACTIVITY_LOG_ASYNC:-false}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      EVALUATION_RUN_MODE: ${EVALUATION_RUN_MODE:-celery}
      PLUS_PAYMENT_ENABLED: ${PLUS_PAYMENT_ENABLED:-false}
    command: uv run celery -A app.tasks.celery_app.celery_app beat -l info
    profiles:
      - worker

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
